<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Rafael Copolillo profile image</title>
<desc id="desc">Christ the Redeemer in Rio de Janeiro, selected by Rafael as his student profile image.</desc>
<defs><clipPath id="circle"><circle cx="160" cy="160" r="156"/></clipPath></defs>
<rect width="320" height="320" rx="160" fill="#eaf3ff"/>
<g clip-path="url(#circle)">
<image width="320" height="320" preserveAspectRatio="xMidYMid slice" href="data:image/webp;base64,"/>
</g>
<circle cx="160" cy="160" r="156" fill="none" stroke="#ffffff" stroke-width="8"/>
</svg>