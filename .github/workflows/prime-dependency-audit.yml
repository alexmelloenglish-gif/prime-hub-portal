name: PRIME Production Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/prime-dependency-audit.mjs"
      - ".github/workflows/prime-dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/prime-dependency-audit.mjs"
      - ".github/workflows/prime-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: npm run audit:prime-engine

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-production-dependency-audit
          path: artifacts/prime-dependency-audit.md
          if-no-files-found: error
