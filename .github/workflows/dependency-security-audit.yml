name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-report.mjs'
      - '.github/workflows/dependency-security-audit.yml'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install committed lockfile
        run: npm ci

      - name: Generate full and production-only advisory matrix
        run: node scripts/dependency-security-report.mjs

      - name: Upload advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: artifacts/dependency-security-report.json
          if-no-files-found: error
