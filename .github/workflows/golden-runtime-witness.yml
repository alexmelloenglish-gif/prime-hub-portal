name: Golden Runtime Witness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-runtime-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: prime_runtime_witness
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prime -d prime_runtime_witness"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://prime:prime@localhost:5432/prime_runtime_witness?schema=public
      DATABASE_URL_UNPOOLED: postgresql://prime:prime@localhost:5432/prime_runtime_witness?schema=public
      NODE_ENV: test
      NEXTAUTH_SECRET: runtime-witness-only-not-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository migrations to disposable Postgres only
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Execute Golden runtime witness
        run: node --experimental-strip-types --loader ./scripts/runtime-witness-alias-loader.mjs ./scripts/golden-runtime-witness.ts

      - name: Upload persisted witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-runtime-witness
          path: artifacts/golden-runtime-witness.json
          if-no-files-found: warn
