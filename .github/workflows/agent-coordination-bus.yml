name: Agent Coordination Bus Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/agent-coordination/**'
      - 'app/api/coordination/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260925162500_add_agent_coordination_bus_phase1/**'
      - 'scripts/agent-coordination-bus-self-test.mjs'
      - 'docs/operations/AGENT_COORDINATION_BUS_PHASE1.md'
      - '.env.example'
      - '.github/workflows/agent-coordination-bus.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agent-coordination/**'
      - 'app/api/coordination/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260925162500_add_agent_coordination_bus_phase1/**'
      - 'scripts/agent-coordination-bus-self-test.mjs'
      - '.github/workflows/agent-coordination-bus.yml'

permissions:
  contents: read

jobs:
  agent-coordination-bus:
    name: Agent Coordination Bus Phase 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Coordination bus self-test
        run: node --experimental-strip-types scripts/agent-coordination-bus-self-test.mjs

      - name: TypeScript gate
        run: npx tsc --noEmit
