name: Agent Coordination Bus

on:
  pull_request:
    branches: [main, infra/agent-coordination-bus-phase1-2026-09-25]
    paths:
      - 'lib/agent-coordination/**'
      - 'app/api/coordination/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260925162500_add_agent_coordination_bus_phase1/**'
      - 'prisma/migrations/20260925213000_add_agent_coordination_bus_phase2_active/**'
      - 'scripts/agent-coordination-bus-self-test.mjs'
      - 'scripts/agent-coordination-active-self-test.mjs'
      - 'docs/operations/AGENT_COORDINATION_BUS_PHASE1.md'
      - '.env.example'
      - '.github/workflows/agent-coordination-bus.yml'
  push:
    branches: [main]
    paths:
      - 'lib/agent-coordination/**'
      - 'app/api/coordination/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260925162500_add_agent_coordination_bus_phase1/**'
      - 'prisma/migrations/20260925213000_add_agent_coordination_bus_phase2_active/**'
      - 'scripts/agent-coordination-bus-self-test.mjs'
      - 'scripts/agent-coordination-active-self-test.mjs'
      - '.github/workflows/agent-coordination-bus.yml'

permissions:
  contents: read

jobs:
  agent-coordination-bus:
    name: Agent Coordination Bus
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Coordination bus Phase 1 self-test
        run: node --experimental-strip-types scripts/agent-coordination-bus-self-test.mjs

      - name: Coordination bus Phase 2 active self-test
        run: node --experimental-strip-types scripts/agent-coordination-active-self-test.mjs

      - name: TypeScript gate
        run: npx tsc --noEmit
