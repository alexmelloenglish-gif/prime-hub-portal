name: Dependency Audit Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/issue-58-dependency-audit

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run npm audit fix
        run: npm audit fix --omit=dev
      - name: Commit changes
        run: |
          git config user.name "PRIME DIGITAL HUB"
          git config user.email "alexmello.english@gmail.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "fix(deps): npm audit fix for production advisories"
          git push
