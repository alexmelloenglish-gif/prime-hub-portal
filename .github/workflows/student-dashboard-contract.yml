name: Student Dashboard Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  student-dashboard-contract:
    # Stable job name: configure this exact check as required before merging to main.
    name: Student Dashboard Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Student Dashboard v1.0 contract gate
        run: npm run student-dashboard:self-test

      - name: Canonical strict gate
        run: npm run canonical:validate:strict

      - name: G6 authority gate
        run: npm run g6:account-learner:self-test

      - name: Shared Learning Machine gate
        run: npm run shared-learning-machine:self-test

      - name: Next build gate
        run: npx prisma generate && npx next build
