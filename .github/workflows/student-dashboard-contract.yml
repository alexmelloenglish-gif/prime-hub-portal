name: Student Dashboard Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  student-dashboard-contract:
    name: Student Dashboard Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard contract
        run: npm run student-dashboard:self-test

      - name: Validate canonical data
        run: npm run canonical:validate:strict

      - name: Run G6 authority infrastructure contract
        run: npm run g6:account-learner:self-test
