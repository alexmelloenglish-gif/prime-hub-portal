name: Issue 58 — PRIME Engine validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chore/issue-58-prime-engine-closure
  workflow_dispatch:

jobs:
  retry-legacy:
    name: Retry legacy eligibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run legacy retry eligibility test
        run: npm run test:issue-58-retry-legacy

  providers-health:
    name: Provider health and fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run provider health and fallback test
        run: npm run test:issue-58-providers-health

  student-isolation:
    name: Student authentication and isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prime_test
          POSTGRES_PASSWORD: prime_test
          POSTGRES_DB: prime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prime_test -d prime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prime_test:prime_test@localhost:5432/prime_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://prime_test:prime_test@localhost:5432/prime_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare disposable PostgreSQL schema
        run: npx prisma db push --skip-generate

      - name: Run student authentication and isolation tests
        run: npm run test:issue-58-student-isolation
