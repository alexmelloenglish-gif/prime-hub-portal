version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
